services:
  rentease-api:
    image: rentease:latest
    build:
      context: .
      dockerfile: RentEase/Dockerfile
    container_name: rentease_api
    restart: always
    environment:
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=rentease_db;Username=postgres;Password=bohdan
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: rentease_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bohdan
      POSTGRES_DB: rentease_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: rentease_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: